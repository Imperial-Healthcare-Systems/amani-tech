<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs — Amani Tech Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-admin data-page="jobs" data-title="Jobs">
<div class="admin-shell"><div class="a-main"><div class="a-content">
  <div class="a-page-head"><div><h2>All Jobs</h2><p>Create, publish, pause, close and feature jobs. Only published jobs appear on the site.</p></div><div class="actions"><button class="btn btn-outline btn-sm" type="button" id="export"><span data-icon="download" data-icon-class="icon-sm"></span>Export CSV</button><a class="btn btn-primary btn-sm" href="job-form.html"><span data-icon="plus" data-icon-class="icon-sm"></span>Create Job</a></div></div>
  <div class="a-toolbar">
    <div class="search"><span data-icon="search" data-icon-class="icon-sm"></span><input id="q" type="search" placeholder="Search title, company, location or ID" aria-label="Search jobs"></div>
    <select class="select" id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option>DRAFT</option><option>PUBLISHED</option><option>PAUSED</option><option>CLOSED</option><option>ARCHIVED</option></select>
    <select class="select" id="f-cat" aria-label="Filter by category"></select>
  </div>
  <div class="a-table-wrap">
    <table class="a-table"><thead><tr><th style="width:36px"><input class="row-check" type="checkbox" aria-label="Select all"></th><th>Job</th><th>Category</th><th>Location</th><th class="num">Apps</th><th>Featured</th><th>Status</th><th>Posted</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="a-table-foot"><span id="count"></span><span>Showing all results</span></div>
  </div>
</div></div></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script>
</body>
</html>
