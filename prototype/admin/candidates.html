<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidates — Amani Tech Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-admin data-page="candidates" data-title="Candidates">
<div class="admin-shell"><div class="a-main"><div class="a-content">
  <div class="a-page-head"><div><h2>Candidates</h2><p>Everyone who has registered or applied. One record per email address.</p></div><div class="actions"><button class="btn btn-outline btn-sm" type="button" id="export"><span data-icon="download" data-icon-class="icon-sm"></span>Export CSV</button></div></div>
  <div class="a-toolbar">
    <div class="search"><span data-icon="search" data-icon-class="icon-sm"></span><input id="q" type="search" placeholder="Search name, email, phone, title or location" aria-label="Search candidates"></div>
    <select class="select" id="f-cat" aria-label="Filter by category"></select>
  </div>
  <div class="a-table-wrap">
    <table class="a-table"><thead><tr><th>Candidate</th><th>Phone</th><th>Location</th><th>Profile</th><th>Experience</th><th class="num">Apps</th><th>Registered</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="a-table-foot"><span id="count"></span></div>
  </div>
</div></div></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script>
</body>
</html>
