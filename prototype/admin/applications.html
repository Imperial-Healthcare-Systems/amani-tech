<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications — Amani Tech Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-admin data-page="applications" data-title="Applications">
<div class="admin-shell"><div class="a-main"><div class="a-content">
  <div class="a-page-head"><div><h2>Applications</h2><p>Every job application with candidate details and resume. Click a row to review and update status.</p></div><div class="actions"><button class="btn btn-outline btn-sm" type="button" id="export"><span data-icon="download" data-icon-class="icon-sm"></span>Export CSV</button></div></div>
  <div class="a-toolbar">
    <div class="search"><span data-icon="search" data-icon-class="icon-sm"></span><input id="q" type="search" placeholder="Search name, email, phone, title or location" aria-label="Search applications"></div>
    <select class="select" id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option>SUBMITTED</option><option>REVIEWING</option><option>SHORTLISTED</option><option>REJECTED</option><option>CLOSED</option></select>
    <select class="select" id="f-job" aria-label="Filter by job"></select>
    <select class="select" id="f-cat" aria-label="Filter by category"></select>
  </div>
  <div class="a-table-wrap">
    <table class="a-table"><thead><tr><th>Candidate</th><th>Applied job</th><th>Category</th><th>Experience</th><th>Location</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="a-table-foot"><span id="count"></span><span>Resumes open via signed URLs in production</span></div>
  </div>
  <div class="drawer" id="app-drawer" aria-hidden="true"><div class="backdrop" data-close></div><div class="panel" role="dialog" aria-label="Application details"><div class="panel-head"><div><h2></h2><p></p></div><button type="button" class="close-btn" aria-label="Close" data-close><span data-icon="x"></span></button></div><div class="panel-body"></div><div class="panel-foot"><button type="button" class="btn btn-ghost btn-sm" data-close>Close</button><button type="button" class="btn btn-primary btn-sm" data-close>Save note</button></div></div></div>
</div></div></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script>
</body>
</html>
