<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Enquiries — Amani Tech Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-admin data-page="vendors" data-title="Vendor Enquiries">
<div class="admin-shell"><div class="a-main"><div class="a-content">
  <div class="a-page-head"><div><h2>Staffing partner applications</h2><p>Vendors and recruiters who applied to partner with Amani Tech. Approve, reject and keep notes.</p></div><div class="actions"><button class="btn btn-outline btn-sm" type="button" id="export"><span data-icon="download" data-icon-class="icon-sm"></span>Export CSV</button></div></div>
  <div class="a-toolbar">
    <div class="search"><span data-icon="search" data-icon-class="icon-sm"></span><input id="q" type="search" placeholder="Search company, contact, specialisation or location" aria-label="Search vendors"></div>
    <select class="select" id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option></select>
  </div>
  <div class="a-table-wrap">
    <table class="a-table"><thead><tr><th>Company</th><th>Services</th><th>Specialisation</th><th>Location</th><th class="num">Exp.</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="a-table-foot"><span id="count"></span></div>
  </div>
  <div class="drawer" id="lead-drawer" aria-hidden="true"><div class="backdrop" data-close></div><div class="panel" role="dialog" aria-label="Vendor details"><div class="panel-head"><div><h2></h2><p></p></div><button type="button" class="close-btn" aria-label="Close" data-close><span data-icon="x"></span></button></div><div class="panel-body"></div><div class="panel-foot"><button type="button" class="btn btn-ghost btn-sm" data-close>Close</button></div></div></div>
</div></div></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script>
</body>
</html>
