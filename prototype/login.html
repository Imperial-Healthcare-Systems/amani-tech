<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate Login | Amani Tech</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
<main id="main">
  <div class="container auth-wrap">
    <div class="form-card reveal">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to track your applications.</p>
      <form id="login-form" novalidate data-error="We couldn't sign you in. Check your email and password and try again.">
        <div class="form-status" role="alert"></div>
        <div class="field"><label class="req" for="l-email">Email</label><input class="input" id="l-email" type="email" required autocomplete="email"><span class="error-msg"></span></div>
        <div class="field"><div class="row between"><label class="req" for="l-pass">Password</label><a class="small" href="#">Forgot password?</a></div><input class="input" id="l-pass" type="password" required autocomplete="current-password"><span class="error-msg"></span></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg"><span class="spinner"></span>Sign in</button>
      </form>
      <p class="small muted center mt-24" style="margin-bottom:0">New to Amani Tech? <a href="register.html">Create your profile</a></p>
    </div>
    <p class="small muted center mt-16"><span data-icon="lock" data-icon-class="icon-sm" style="display:inline-flex;vertical-align:middle"></span> Your data is protected. See our <a href="privacy.html">Privacy Policy</a>.</p>
  </div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
